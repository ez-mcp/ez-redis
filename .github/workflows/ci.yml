# CI per plan section 6.5 (EZ-Redis Phases 1-2).
#
# - Third-party actions are pinned to full 40-char commit SHAs (verified via
#   `git ls-remote`, lightweight commit tags) with a version comment.
# - Untrusted `${{ github.* }}` context is NEVER interpolated into `run:`
#   command strings; event/PR data reaches bash only through the sanctioned
#   env-var assignments below. The supply-chain job asserts this (T12).

name: ci

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type:
    name: lint & type (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
        with:
          version: "0.10.9"
          python-version: ${{ matrix.python-version }}
      - name: Sync the locked environment
        # NOTE: `uv sync --locked --frozen` (plan §4.5/§6.5 wording) is
        # rejected by uv 0.10.9 ("the argument '--locked' cannot be used
        # with '--frozen'"). Under uv 0.10.9 `--locked` alone is the
        # drift-failing form: it asserts the lockfile is up-to-date and
        # syncs from it (drift = fail, the §4.5 guarantee), while
        # `--frozen` alone would sync a stale lock silently.
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Pyright (strict)
        run: uv run pyright

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Sanctioned env-var assignment: merge base for the golden-diff
      # diagnostic artifact (empty on some events; the step falls back).
      GOLDEN_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          # Full history so the golden-diff diagnostic can reach the merge
          # base (default shallow clone cannot).
          fetch-depth: 0
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
        with:
          version: "0.10.9"
          python-version: ${{ matrix.python-version }}
      - name: Sync the locked environment
        # NOTE: `uv sync --locked --frozen` (plan §4.5/§6.5 wording) is
        # rejected by uv 0.10.9 ("the argument '--locked' cannot be used
        # with '--frozen'"). Under uv 0.10.9 `--locked` alone is the
        # drift-failing form: it asserts the lockfile is up-to-date and
        # syncs from it (drift = fail, the §4.5 guarantee), while
        # `--frozen` alone would sync a stale lock silently.
        run: uv sync --locked
      - name: Run unit/golden/adversarial suite with coverage
        run: |
          set -o pipefail
          uv run pytest -m "not property" --cov=src/ez_redis --cov-branch --cov-report=xml | tee pytest.log
      - name: Per-module coverage gate (BLOCKS merge)
        run: uv run coverage json -o cov.json && uv run python scripts/coverage_gate.py
      - name: Collect golden diff for diagnostics
        if: failure()
        run: |
          git diff "${GOLDEN_DIFF_BASE:-HEAD~1}" HEAD -- tests/golden/ > golden.diff || true
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-diagnostics-py${{ matrix.python-version }}
          path: |
            pytest.log
            golden.diff
            coverage.xml
            cov.json
            tests/golden/
          if-no-files-found: ignore
          retention-days: 7

  test-property:
    name: property-based tests (HYPOTHESIS_PROFILE=ci)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
        with:
          version: "0.10.9"
          python-version: "3.12"
      - name: Sync the locked environment
        # NOTE: same uv 0.10.9 constraint as above -- `--locked` alone.
        run: uv sync --locked
      - name: Property-based tests (ci profile; BLOCKS merge)
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run pytest -m property

  golden-stability:
    name: goldens stable (two runs, py3.11 floor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
        with:
          version: "0.10.9"
          # Goldens gate on the floor version (3.11) only (plan Q2).
          python-version: "3.11"
      - name: Sync the locked environment
        run: uv sync --locked
      - name: Golden suite (run 1)
        run: uv run pytest -m golden
      - name: Golden suite (run 2, no cacheprovider)
        run: uv run pytest -m golden -p no:cacheprovider

  golden-diff-guard:
    # Goldens change only in PRs whose body carries a non-empty why-goldens:
    # token (plan section 6.1). File list and body come from the REST API;
    # there is no checkout, so no git state can disagree with the API.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Sanctioned env-var assignments (never interpolated inside run:).
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check tests/golden/ changes against the why-goldens token
        run: |
          set -euo pipefail
          files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename')"
          changed="$(printf '%s\n' "$files" | grep -E '^tests/golden/' || true)"
          if [ -z "$changed" ]; then
            echo "No tests/golden/ changes in this PR; guard passes."
            exit 0
          fi
          echo "Changed files under tests/golden/:"
          printf '%s\n' "$changed"
          body="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""')"
          if printf '%s' "$body" | grep -Eq 'why-goldens:[^[:space:],)]'; then
            echo "why-goldens: token present; guard passes."
            exit 0
          fi
          echo "::error::tests/golden/ changed without a why-goldens: token in the PR body."
          echo "Explain why goldens changed under why-goldens: in the PR body;"
          echo "regenerate with --update-goldens (see tests/golden/README.md when it lands in Phase 2, and scripts/golden_classify.py)."
          exit 1

  supply-chain:
    name: supply chain (audit + lock + T12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c7f87aa956e4c323abf06d5dec078e358f6b4d04 # v6.0.0
        with:
          version: "0.10.9"
      - name: Sync locked environment with all extras (drift = fail)
        run: uv sync --locked --all-extras
      - name: Audit the locked environment
        run: uv run pip-audit
      - name: Verify lockfile is up to date
        run: uv lock --check
      - name: Assert no github.event interpolation inside run blocks (T12)
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          # Assembled at runtime so this scanner does not match its own body.
          needle = "$" + "{" + "{" + " github.event"
          failures = []
          # Single pass over each workflow file: O(total lines).
          for path in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
              in_run = False
              run_indent = 0
              for lineno, line in enumerate(
                  path.read_text(encoding="utf-8").splitlines(), 1
              ):
                  stripped = line.strip()
                  if not stripped:
                      continue
                  indent = len(line) - len(line.lstrip())
                  if in_run and indent <= run_indent and not stripped.startswith("run:"):
                      in_run = False
                  if stripped.startswith("run:"):
                      in_run = True
                      run_indent = indent
                  if in_run and needle in stripped:
                      failures.append(f"{path}:{lineno}: github.event inside run: block")
          if failures:
              for failure in failures:
                  print(failure, file=sys.stderr)
              sys.exit(1)
          print("T12 check: no github.event interpolation inside run blocks")
          PY