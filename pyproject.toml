[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[project]
name = "ez-redis"
version = "0.1.0"
description = "Redis expertise for AI coding agents: MCP server + hook pack"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "ez-redis contributors" }]
keywords = ["redis", "mcp", "ai-agents", "static-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "mcp>=2,<3",
  "structlog>=24.1,<25",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.8,<0.9",
  "pyright>=1.1.390,<2",
  "pre-commit>=4,<5",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "S"]
ignore = [
  # assert is the pytest idiom; tests rely on it
  "S101",
  # subprocess with a fixed argv list is the documented Phase-8 pattern (shell=False)
  "S603",
  # PATH lookup for the rg binary is intentional (rg discovery, Phase 8/44)
  "S607",
]

[tool.ruff.lint.per-file-ignores]
# Fixtures may contain long lines and deliberate secret-like strings (Phase 3 secrets-app)
"tests/**" = ["S", "E501"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Note (verified against pytest 8.4.x source): --import-mode has no ini-key
# equivalent in this version; tests/__init__.py package markers make the
# default "prepend" mode unambiguous, so the option is unnecessary here.

[tool.coverage.run]
source = ["src/ez_redis"]
branch = true

[tool.coverage.report]
# Placeholder: the 90% engine/ gate activates in later phases (parent plan Phase 1).
fail_under = 0
